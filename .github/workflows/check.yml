name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The Claude Code version the mod was last checked against.
      # Raise it when the mod is updated for a newer release.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.330

      - name: Validate the mod
        run: claude plugin validate .

      - name: Run the tests
        run: claude plugin test .
